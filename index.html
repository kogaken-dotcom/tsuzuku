<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1015">
  <title>つづく — 習慣とTODO</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="つづく">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">つづく<span>.</span></div>
    <div class="top-right">
      <button class="ticket" id="ticketBadge" data-act="ticketinfo" title="シールド"></button>
      <button class="iconbtn" data-act="settings" aria-label="設定">⚙️</button>
    </div>
  </header>

  <main id="view"></main>

  <nav class="tabbar" id="tabbar">
    <button data-tab="today" class="active"><span>⚡</span>今日</button>
    <button data-tab="log"><span>📈</span>成長</button>
  </nav>

  <dialog id="habitDialog">
    <form method="dialog" id="habitForm">
      <h2>習慣を編集</h2>
      <input type="hidden" name="id">
      <div class="row">
        <label class="emoji-field">絵文字<input name="emoji" maxlength="4"></label>
        <label class="grow">なにをする？<input name="name" required></label>
      </div>
      <label>🕖 いつやる？
        <input name="cue" placeholder="例：寝る前、朝ごはんのあと">
        <small>毎日やっていることのあとにくっつけると忘れにくくなります</small>
      </label>
      <label>⚡ 最低ライン（しんどい日はこれだけ）
        <input name="tiny" placeholder="例：1ページだけ読む">
        <small>これだけでも1回クリア。ゼロの日をなくすのが最強の戦略</small>
      </label>
      <details class="more">
        <summary>くわしく設定</summary>
        <label>⏰ 通知する時刻
          <input type="time" name="remindAt" style="width:auto">
          <small>まだやっていないときだけ、この時刻にお知らせします（⚙️で通知をオンに）</small>
        </label>
        <fieldset class="days">
          <legend>やる曜日</legend>
          <div id="dayPicker"></div>
        </fieldset>
        <label>🎯 目指す姿
          <input name="identity" placeholder="例：読書家">
          <small>クリアするたびに、目指す姿へ1ポイント積み上がります</small>
        </label>
        <label>🎁 やったあとのごほうび
          <input name="reward" placeholder="例：好きなお茶をいれる">
        </label>
      </details>
      <div class="dialog-actions">
        <button type="button" class="ghost danger" id="archiveHabit">やめる</button>
        <span class="spacer"></span>
        <button type="button" class="ghost" id="cancelHabit">キャンセル</button>
        <button type="submit" class="primary">保存</button>
      </div>
    </form>
  </dialog>

  <dialog id="settingsDialog" class="sheet">
    <div class="sheet-head"><h2>⚙️ 設定</h2><button class="ghost" data-act="closesettings">閉じる</button></div>
    <div id="settingsBody"></div>
  </dialog>

  <dialog id="celebrate" class="celebrate">
    <div class="big" id="celebrateIcon">🎉</div>
    <h2 id="celebrateTitle"></h2>
    <p id="celebrateText"></p>
    <form method="dialog"><button class="primary">OK</button></form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="tip" class="tip" hidden></div>
  <canvas id="confetti"></canvas>

  <script src="app.js"></script>
</body>
</html>
