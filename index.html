<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5b8def">
  <title>つづく — 習慣とTODO</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="つづく">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">🌱 つづく</div>
    <div class="lvbox" id="lvbox"></div>
  </header>

  <main id="view"></main>

  <nav class="tabbar" id="tabbar">
    <button data-tab="today" class="active"><span>☀️</span>今日</button>
    <button data-tab="habits"><span>🔁</span>習慣</button>
    <button data-tab="growth"><span>📈</span>成長</button>
    <button data-tab="reflect"><span>📝</span>ふりかえり</button>
  </nav>

  <dialog id="habitDialog">
    <form method="dialog" id="habitForm">
      <h2 id="habitDialogTitle">新しい習慣</h2>
      <input type="hidden" name="id">
      <div class="row">
        <label class="emoji-field">絵文字<input name="emoji" maxlength="4" value="📚"></label>
        <label class="grow">習慣の名前<input name="name" required placeholder="例：本を読む"></label>
      </div>
      <label>🪪 どんな人になりたい？（アイデンティティ）
        <input name="identity" placeholder="例：読書家">
        <small>「〇〇な人」になるための1票として記録されます</small>
      </label>
      <label>📍 きっかけ（〜したら / 〜のあとに）
        <input name="cue" placeholder="例：朝コーヒーを淹れたら">
        <small>If-Thenプランニング：実行率が大きく上がると言われています</small>
      </label>
      <label>🐣 2分だけバージョン（やる気ゼロの日用）
        <input name="tiny" placeholder="例：1ページだけ読む">
        <small>ハードルを極限まで下げた版。これでも記録はつながります</small>
      </label>
      <label>⏰ リマインダー時刻（任意）
        <input type="time" name="remindAt" style="width:auto">
        <small>未完了ならこの時刻に通知します（「習慣」タブで通知をオンにしてください）</small>
      </label>
      <label>🎁 やった後のごほうび（任意）
        <input name="reward" placeholder="例：好きなお菓子をひとつ">
      </label>
      <fieldset class="days">
        <legend>実行する曜日</legend>
        <div id="dayPicker"></div>
      </fieldset>
      <div class="dialog-actions">
        <button type="button" class="ghost danger" id="archiveHabit" hidden>アーカイブ</button>
        <span class="spacer"></span>
        <button type="button" class="ghost" id="cancelHabit">キャンセル</button>
        <button type="submit" class="primary">保存</button>
      </div>
    </form>
  </dialog>

  <dialog id="celebrate" class="celebrate">
    <div class="big" id="celebrateIcon">🎉</div>
    <h2 id="celebrateTitle"></h2>
    <p id="celebrateText"></p>
    <form method="dialog"><button class="primary">やったね！</button></form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <canvas id="confetti"></canvas>

  <script src="app.js"></script>
</body>
</html>
